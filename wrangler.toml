name = "unified-dashboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# ── KV Namespaces ──
# Reemplazá los "id" por los IDs reales de tus namespaces existentes
# (los mismos que ya usan crypto-radar y wallet-guardian).
# Podés obtenerlos con: wrangler kv:namespace list

[[kv_namespaces]]
binding = "RADAR_KV"
id = "152d98f73c3a40c288da3c3022fe9b2c"  # radar-kv

[[kv_namespaces]]
binding = "GUARDIAN_KV"
id = "6617361c7d3e479d8a705afa8d10ff0a"  # wallet-guardian-kv

# ── Cron: corre cada 15 minutos. Ajustá el intervalo a gusto. ──
[triggers]
crons = ["*/15 * * * *"]

# ── Variables de entorno / secrets ──
# NO pongas valores reales acá — usá `wrangler secret put <NOMBRE>` para
# cada uno de estos, así no quedan en texto plano en el repo:
#   wrangler secret put DASH_PASSWORD
#   wrangler secret put DASH_PASSWORD_HASH
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#
# DASH_PASSWORD_HASH puede ser simplemente otro string secreto fijo que
# uses como "firma" de sesión (no hace falta que sea un hash real, es
# solo para que la cookie no sea adivinable). Ejemplo:
#   wrangler secret put DASH_PASSWORD_HASH
#   (pegás un string random largo, tipo el output de `openssl rand -hex 32`)
