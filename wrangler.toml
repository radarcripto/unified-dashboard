name = "unified-dashboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# ── KV Namespaces ──
# Reemplazá los "id" por los IDs reales de tus namespaces existentes
# (los mismos que ya usan crypto-radar y wallet-guardian).
# Podés obtenerlos con: wrangler kv:namespace list

[[kv_namespaces]]
binding = "RADAR_KV"
id = "152d98f73c3a40c288da3c3022fe9b2c"  # radar-kv

[[kv_namespaces]]
binding = "GUARDIAN_KV"
id = "6617361c7d3e479d8a705afa8d10ff0a"  # wallet-guardian-kv

# ── Cron: corre cada 15 minutos. Ajustá el intervalo a gusto. ──
[triggers]
crons = ["*/15 * * * *"]

# ── Variables de entorno / secrets ──
# NO pongas valores reales acá. Cargalos desde el dashboard de Cloudflare:
#   Workers & Pages → unified-dashboard → Settings → Variables and Secrets
#   → Add → marcá cada una como "Secret" (encrypted), no "Text":
#     - DASH_PASSWORD        → la password para entrar al dashboard
#     - DASH_PASSWORD_HASH   → un string random largo, cualquiera, solo
#                              para que la cookie de sesión no sea
#                              adivinable (no hace falta que sea un hash real)
#     - TELEGRAM_BOT_TOKEN   → podés reusar el mismo bot de Wallet Guardian
#     - TELEGRAM_CHAT_ID
